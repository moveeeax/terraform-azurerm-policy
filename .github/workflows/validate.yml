name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
          tofu_version: 1.13.8

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      # Runs against a mocked provider, so no Azure credentials are needed.
      - name: test
        run: tofu test

      - name: validate examples
        run: |
          set -euo pipefail
          for dir in examples/*/; do
            echo "::group::${dir}"
            tofu -chdir="${dir}" init -backend=false
            tofu -chdir="${dir}" validate
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive
